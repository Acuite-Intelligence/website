<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>IMG Residency Training in Canada | Acuité Intelligence</title>
<meta name="description" content="A five-year view of access, outcomes and changing residency opportunities for international medical graduates in Canada, based on CaRMS R-1 Main Residency Match reports for 2020 and 2025.">
<link rel="canonical" href="https://acuiteintelligence.com/imgcarms/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://acuiteintelligence.com/imgcarms/">
<meta property="og:title" content="IMG Residency Training in Canada">
<meta property="og:description" content="How international medical graduates matched to Canadian residency programs in 2020 and 2025.">
<meta property="og:image" content="https://acuiteintelligence.com/imgcarms/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="IMG Residency Training in Canada">
<meta name="twitter:description" content="How international medical graduates matched to Canadian residency programs in 2020 and 2025.">
<meta name="twitter:image" content="https://acuiteintelligence.com/imgcarms/og.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d1b2e;
  --muted: #5a7a9a;
  --line: #dce4ee;
  --canvas: #f5f8fc;
  --panel: #ffffff;
  --nav: #0d1b2e;
  --indigo: #2a4a7a;
  --coral: #b8922e;
  --mint: #2f7d6b;
  --warning: #b56c2f;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 300; }
button, input { font: inherit; }
main { min-height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
aside { position: sticky; top: 0; height: 100vh; padding: 34px 24px; background: var(--nav); color: #eef4fb; display: flex; flex-direction: column; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #e8d8a8; color: var(--nav); font: 600 24px 'Cormorant Garamond', Georgia, serif; }
.brand strong { display: block; font: 500 21px 'Cormorant Garamond', Georgia, serif; letter-spacing: .04em; }
.brand span { display: block; margin-top: 3px; font-size: 10px; color: #9fb0c3; text-transform: uppercase; letter-spacing: .1em; }
.lang-toggle { display: inline-flex; gap: 6px; margin: 22px 0 0; }
.lang-toggle button { background: none; border: 1px solid rgba(255,255,255,.22); border-radius: 2px; color: #aebdcd; font: 400 11px/1 'DM Sans', sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 7px 14px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.lang-toggle button.active { background: var(--white); color: var(--nav); border-color: var(--white); font-weight: 500; }
.lang-toggle button:not(.active):hover { color: var(--white); border-color: rgba(255,255,255,.42); }
nav { margin-top: 34px; display: grid; gap: 8px; }
nav button { border: 0; background: transparent; color: #aebdcd; text-align: left; padding: 12px 13px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; gap: 11px; }
nav button:hover, nav button.active { background: #1a3054; color: white; }
.nav-dot { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
nav button.active .nav-dot { background: #d4a93a; border-color: #d4a93a; box-shadow: 0 0 0 4px rgba(212,169,58,.15); }
.source-note { margin-top: auto; padding: 17px; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; font-size: 12px; line-height: 1.45; }
.source-note > span { display: block; color: #8fa3b8; text-transform: uppercase; letter-spacing: .12em; font-size: 9px; margin-bottom: 6px; }
.source-note small { display: block; color: #8fa3b8; margin-top: 7px; }
.site-backlink { margin-top: 14px; color: #9fb0c3; font-size: 11px; letter-spacing: .04em; text-decoration: none; transition: color .2s; }
.site-backlink:hover { color: #d4a93a; }
.workspace { padding: 45px clamp(28px, 4vw, 68px) 70px; overflow: hidden; }
header { display: flex; justify-content: space-between; gap: 32px; align-items: end; margin-bottom: 35px; }
.eyebrow { margin: 0 0 8px; color: var(--indigo); text-transform: uppercase; letter-spacing: .13em; font-size: 11px; font-weight: 700; }
h1 { margin: 0; font: 500 clamp(34px, 4vw, 54px)/1.05 'Cormorant Garamond', Georgia, serif; letter-spacing: -.01em; }
.subtitle { max-width: 760px; margin: 14px 0 0; color: var(--muted); line-height: 1.55; }
.year-pill { min-width: 144px; padding: 13px 16px; border-left: 3px solid var(--coral); background: #fff; }
.year-pill span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
.year-pill strong { display: block; margin-top: 4px; font-size: 16px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { min-height: 142px; background: var(--panel); border: 1px solid var(--line); padding: 20px; border-radius: 4px; }
.kpi.featured { background: var(--nav); color: white; border-color: var(--nav); }
.kpi > span { color: var(--muted); font-size: 12px; }
.kpi.featured > span { color: #aebed0; }
.kpi > strong { display: block; margin-top: 15px; font: 500 35px 'Cormorant Garamond', Georgia, serif; }
.kpi p { color: var(--muted); font-size: 11px; margin: 12px 0 0; }
.kpi.featured p { color: #b9c7d5; }
.metric-help { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: help; outline: none; }
.help-icon { width: 15px; height: 15px; display: inline-grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 9px; font-weight: 700; opacity: .75; }
[data-tooltip] { position: relative; }
[data-tooltip]::after { content: attr(data-tooltip); position: absolute; left: 0; bottom: calc(100% + 10px); z-index: 20; width: min(290px, 70vw); padding: 10px 12px; border-radius: 4px; background: #0d1b2e; color: white; font-size: 11px; font-weight: 400; line-height: 1.45; text-align: left; box-shadow: 0 8px 24px rgba(10,25,42,.22); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .15s, transform .15s; }
[data-tooltip]:hover::after, [data-tooltip]:focus::after { opacity: 1; transform: translateY(0); }
.designated-footnote { margin: -3px 0 18px; padding: 12px 16px; background: #eef3f9; color: var(--muted); font-size: 11px; line-height: 1.55; border-left: 3px solid var(--indigo); }
.delta { font-weight: 700; }
.delta.up { color: var(--mint); }
.featured .delta.up { color: #6fb3a3; }
.delta.down { color: var(--coral); }
.delta.flat, .muted { color: var(--muted); }
.panel-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 25px; border-radius: 4px; }
.span-7 { grid-column: span 7; }
.span-5 { grid-column: span 5; }
.panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h2 { margin: 0; font: 500 25px/1.2 'Cormorant Garamond', Georgia, serif; }
.metric-tag { padding: 5px 8px; background: #e8f0f8; color: var(--indigo); border-radius: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.panel-copy { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 760px; }
.trend-chart { height: 190px; display: flex; align-items: end; gap: clamp(7px, 1.2vw, 16px); padding: 15px 4px 0; border-bottom: 1px solid var(--line); }
.trend-column { flex: 1; text-align: center; color: var(--muted); font-size: 10px; }
.trend-values { height: 160px; display: flex; align-items: end; justify-content: center; gap: 3px; }
.program-bar, .discipline-bar { width: 42%; min-height: 5px; border-radius: 2px 2px 0 0; }
.program-bar { background: var(--indigo); }
.discipline-bar { background: var(--coral); }
.trend-column > span { display: block; margin-top: 7px; }
.legend { display: flex; gap: 20px; margin-top: 14px; color: var(--muted); font-size: 11px; }
.swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
.swatch.indigo { background: var(--indigo); }
.swatch.coral { background: var(--coral); }
.swatch.mint { background: var(--mint); }
.swatch.pale { background: #dfe5ea; }
.mini-bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 1.6fr) 2fr 32px; gap: 10px; align-items: center; font-size: 10px; }
.bar-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #495467; }
.bar-row strong { text-align: right; font-size: 10px; }
.bar-track { height: 7px; background: #e8f0f8; }
.bar-fill { height: 100%; background: var(--indigo); }
.insight-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; background: #e7ecef; border-left: 4px solid var(--nav); }
.insight-strip > div { padding: 19px 24px; display: flex; align-items: center; gap: 15px; border-right: 1px solid #d4dce2; }
.insight-number { font: 500 26px 'Cormorant Garamond', Georgia, serif; color: var(--mint); }
.insight-number.warning { color: var(--warning); }
.insight-strip p { margin: 0; color: #586577; font-size: 11px; line-height: 1.4; }
.table-panel { padding: 28px; }
.panel-heading.responsive { align-items: end; }
.controls { display: flex; align-items: center; gap: 14px; }
.controls input[placeholder], .panel-heading > input { min-width: 220px; border: 1px solid var(--line); padding: 10px 12px; background: #fafbfc; color: var(--ink); outline: none; }
.controls input:focus, .panel-heading > input:focus { border-color: var(--indigo); }
.controls label { font-size: 11px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
.table-scroll { overflow: auto; max-height: 65vh; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { position: sticky; top: 0; z-index: 1; background: #f7f8fa; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; text-align: right; padding: 12px; }
th:first-child, td:first-child { text-align: left; }
td { padding: 12px; border-top: 1px solid #edf0f3; text-align: right; }
tbody tr:hover { background: #fafbfc; }
.status { display: inline-block; padding: 4px 7px; border-radius: 3px; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
.status.comparable_exact_label { background: #e5f2ee; color: #286d5f; }
.status.comparable_confirmed_rename { background: #e8edfb; color: #35499f; }
.status.parent_category_only { background: #f7eadf; color: #96561f; }
.status.new_label_or_discipline, .status.retired_or_renamed { background: #f7eadf; color: #96561f; }
.methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.methods-grid .full { grid-column: 1 / -1; }
.quality-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 25px; }
.quality-list div { padding: 16px; background: #f6f8fa; border-left: 3px solid var(--mint); }
.quality-list strong { display: block; font: 500 24px 'Cormorant Garamond', Georgia, serif; }
.quality-list span { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; line-height: 1.35; }
.definition-list { margin-top: 20px; }
.denominator-comparison { display: grid; gap: 28px; margin-top: 28px; }
.denominator-label, .stacked-values { display: flex; justify-content: space-between; gap: 18px; }
.denominator-label strong { font: 500 24px 'Cormorant Garamond', Georgia, serif; }
.denominator-label span, .stacked-values { color: var(--muted); font-size: 11px; }
.denominator-label .participant-total { color: var(--ink); font-size: 14px; font-weight: 700; }
.stacked-bar { display: flex; height: 38px; margin: 10px 0 8px; overflow: hidden; background: #dfe5ea; }
.matched-segment, .unmatched-segment { display: grid; place-items: center; min-width: 54px; font-size: 10px; font-weight: 700; }
.matched-segment { background: var(--mint); color: white; }
.unmatched-segment { color: #536071; flex: 1; }
.applicant-trend-panel { margin-top: 18px; }
.applicant-trend { height: 250px; display: flex; align-items: end; gap: clamp(8px, 1.8vw, 22px); padding-top: 12px; border-bottom: 1px solid var(--line); }
.applicant-trend-column { flex: 1; height: 100%; display: grid; grid-template-rows: 22px 1fr 22px; text-align: center; }
.applicant-trend-column strong { color: var(--mint); font-size: 10px; }
.applicant-trend-track { display: flex; align-items: end; justify-content: center; }
.applicant-trend-bar { width: min(42px, 72%); min-height: 8px; background: var(--indigo); border-radius: 3px 3px 0 0; }
.applicant-trend-column > span { padding-top: 7px; color: var(--muted); font-size: 10px; }
.tooltip-point::after { left: 50%; transform: translate(-50%, 4px); }
.tooltip-point:hover::after, .tooltip-point:focus::after { transform: translate(-50%, 0); }
.chart-note { color: var(--muted); font-size: 10px; margin: 12px 0 0; }
.composition-comparison { display: grid; gap: 24px; }
.composition-year > strong { font: 500 23px 'Cormorant Garamond', Georgia, serif; }
.composition-bar { height: 22px; margin: 9px 0 12px; background: #dfe5ea; overflow: hidden; }
.current-segment { height: 100%; min-width: 4px; background: var(--coral); }
.composition-year p { display: flex; justify-content: space-between; gap: 12px; margin: 5px 0; color: var(--muted); font-size: 11px; }
.composition-year p b { color: var(--ink); font-size: 12px; }
.definition-callout { margin-top: 18px; padding: 20px 24px; display: flex; gap: 24px; align-items: baseline; background: #e9f1ef; border-left: 4px solid var(--mint); }
.definition-callout strong { white-space: nowrap; }
.definition-callout p { margin: 0; color: #586577; font-size: 12px; line-height: 1.5; }
details { border-top: 1px solid var(--line); padding: 14px 0; }
summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink); }
details p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 6px; }
details small { color: var(--warning); font-size: 13px; line-height: 1.6; display: block; margin-top: 6px; }
.crosswalk-table { margin-top: 22px; max-height: none; }
.crosswalk-table th, .crosswalk-table td { text-align: left; }
.source-links { margin: 16px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
.source-links a { color: var(--indigo); }
.table-footnote { margin: 16px 0 0; padding: 13px 16px; background: #f2f4f7; border-left: 3px solid var(--indigo); color: var(--muted); font-size: 11px; line-height: 1.55; }
.table-footnote code { color: var(--ink); font-size: 10px; }
@media (max-width: 1050px) {
  main { grid-template-columns: 210px minmax(0, 1fr); }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .span-7, .span-5 { grid-column: 1 / -1; }
}
@media (max-width: 720px) {
  main { display: block; }
  aside { position: relative; height: auto; padding: 20px; }
  nav { margin-top: 24px; display: flex; overflow-x: auto; }
  nav button { white-space: nowrap; }
  .source-note { display: none; }
  .site-backlink { display: none; }
  .workspace { padding: 28px 18px 48px; }
  header { display: block; }
  .year-pill { margin-top: 20px; }
  .kpi-grid, .insight-strip, .methods-grid { grid-template-columns: 1fr; }
  .insight-strip > div { border-bottom: 1px solid #d4dce2; }
  .panel-heading.responsive, .controls { display: grid; }
  .methods-grid .full { grid-column: auto; }
  .definition-callout { display: block; }
  .definition-callout p { margin-top: 8px; }
}

</style>
</head>
